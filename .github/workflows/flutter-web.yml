name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - run: flutter pub get
      - name: Create app config
        env:
          NEWS_API_URL: ${{ vars.NEWS_API_URL }}
        run: |
          if [ -z "$NEWS_API_URL" ]; then
            echo "::error::NEWS_API_URL is empty or unavailable to this job"
            exit 1
          fi
          printf 'NEWS_API_URL=%s\nNEWS_API_USE_CORS_PROXY=false\n' "$NEWS_API_URL" > .env

      - run: flutter analyze
      - run: flutter build web --release --base-href=/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
