name: newsai
description: Release Today - AI news search (Flutter web, responsive).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  get: ^4.6.6
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  get_storage: ^2.1.1
  intl: ^0.20.3
  gif_view: ^1.0.3
  flutter_svg: ^2.4.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/gifs/
    - assets/gifs/gif_loading.gif
    - assets/icons/ic_news.png
